name: CI

# Runs on every branch push and every pull request. Security checks run first
# and gate the build/test/lint job, so a vulnerable dependency fails the branch
# before anything else runs.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # --- Security gate --------------------------------------------------------
  # Must pass before the test job starts. CodeQL (code scanning) runs
  # separately via GitHub's default setup on the default branch and PRs.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -quiet ./...

  # --- Build / test / lint --------------------------------------------------
  test:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m
