version: "2"

linters:
  enable:
    - bodyclose
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Diagnostics/probes favor fmt.Fprintf over structured handling.
      - path: cmd/grokbotd/main.go
        linters: [gocritic]

formatters:
  enable:
    - gofmt
    - goimports
